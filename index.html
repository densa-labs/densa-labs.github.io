<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Densa Labs</title>

  <meta
    name="description"
    content="Densa Labs builds software, developer tools, and research projects."
  >

  <meta name="theme-color" content="#0b0f14">
  <meta name="color-scheme" content="dark">

  <link rel="icon" type="image/png" href="Densa-Letter-Logo.png">

  <style>
    :root {
      --background: #0b0f14;
      --surface: #10151b;
      --surface-hover: #121820;
      --text: #f5f7f8;
      --muted: #9199a3;
      --muted-strong: #b7bec6;
      --border: rgba(255, 255, 255, 0.1);
      --border-hover: rgba(255, 255, 255, 0.2);
      --focus: rgba(255, 255, 255, 0.5);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;

      background: var(--background);
      color: var(--text);

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    img {
      display: block;
      max-width: 100%;
    }

    a {
      color: inherit;
    }

    button,
    input {
      font: inherit;
    }

    .container {
      width: min(1120px, calc(100% - 48px));
      margin: 0 auto;
    }

    /* Header */

    header {
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
      text-decoration: none;
    }

    .brand img {
      width: 158px;
      height: auto;
    }

    /* Project search */

    .project-search {
      position: relative;
      width: min(340px, 100%);
    }

    .project-search svg {
      position: absolute;
      left: 14px;
      top: 50%;
      width: 16px;
      height: 16px;

      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    .project-search input {
      width: 100%;
      height: 42px;

      padding: 0 14px 0 42px;

      border: 1px solid var(--border);
      border-radius: 8px;

      outline: none;

      background: rgba(255, 255, 255, 0.025);
      color: var(--text);

      font-size: 13px;

      transition:
        background 160ms ease,
        border-color 160ms ease;
    }

    .project-search input::placeholder {
      color: #68727d;
    }

    .project-search input:hover {
      border-color: var(--border-hover);
    }

    .project-search input:focus {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.3);
    }

    /* Main */

    main {
      flex: 1;
    }

    /* Projects */

    .projects {
      padding: 86px 0 120px;
    }

    .projects-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 34px;
    }

    .projects-header h1 {
      margin: 0;

      font-size: 24px;
      line-height: 1.2;
      font-weight: 560;
      letter-spacing: -0.02em;
    }

    .project-grid {
      display: grid;
      gap: 16px;
    }

    .project {
      position: relative;

      display: block;
      min-height: 390px;
      padding: 48px 48px 52px;

      border: 1px solid var(--border);
      border-radius: 10px;

      background: transparent;
      color: inherit;
      text-decoration: none;

      overflow: hidden;

      transition:
        background 160ms ease,
        border-color 160ms ease,
        transform 160ms ease;
    }

    .project:hover {
      background: var(--surface-hover);
      border-color: var(--border-hover);
    }

    .project-logo {
      width: min(430px, 100%);
      margin-bottom: 58px;
    }

    .project-content {
      max-width: 620px;
      padding-right: 100px;
    }

    .project-content h2 {
      margin: 0 0 10px;

      font-size: 22px;
      line-height: 1.25;
      font-weight: 550;
      letter-spacing: -0.015em;
    }

    .project-content p {
      margin: 0;

      color: var(--muted);

      font-size: 15px;
      line-height: 1.65;
    }

    .project-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      margin-top: 28px;

      font-size: 14px;
      font-weight: 550;
    }

    .project-link .arrow {
      display: inline-block;
      transition: transform 160ms ease;
    }

    .project:hover .project-link .arrow {
      transform: translateX(3px);
    }

    .project-version {
      position: absolute;
      right: 48px;
      bottom: 48px;

      color: var(--muted);

      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.025em;
    }

    .project[hidden] {
      display: none;
    }

    /* Empty state */

    .no-results {
      display: none;

      padding: 72px 0;

      color: var(--muted);
      font-size: 14px;
    }

    .no-results.visible {
      display: block;
    }

    /* Footer */

    footer {
      border-top: 1px solid var(--border);
    }

    .footer-inner {
      min-height: 92px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 32px;
    }

    .footer-brand {
      display: inline-flex;
      align-items: center;
    }

    .footer-brand img {
      width: 104px;
      height: auto;
      opacity: 0.92;
    }

    .footer-link {
      position: relative;

      padding: 10px 0;

      color: var(--muted);

      font-size: 13px;
      font-weight: 500;

      text-decoration: none;

      transition: color 160ms ease;
    }

    .footer-link::after {
      content: "";

      position: absolute;
      left: 0;
      right: 100%;
      bottom: 7px;

      height: 1px;

      background: var(--text);

      transition: right 160ms ease;
    }

    .footer-link:hover {
      color: var(--text);
    }

    .footer-link:hover::after {
      right: 0;
    }

    /* Accessibility */

    a:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--text);
      outline-offset: 4px;
    }

    /* Responsive */

    @media (max-width: 700px) {
      .container {
        width: min(100% - 40px, 1120px);
      }

      .header-inner {
        min-height: auto;

        flex-direction: column;
        align-items: stretch;
        gap: 18px;

        padding: 20px 0;
      }

      .brand {
        width: fit-content;
      }

      .brand img {
        width: 136px;
      }

      .project-search {
        width: 100%;
      }

      .projects {
        padding: 64px 0 88px;
      }

      .projects-header {
        margin-bottom: 28px;
      }

      .project {
        min-height: 360px;
        padding: 30px 30px 72px;
      }

      .project-logo {
        width: min(330px, 100%);
        margin-bottom: 44px;
      }

      .project-content {
        padding-right: 0;
      }

      .project-version {
        right: 30px;
        bottom: 28px;
      }

      .footer-inner {
        min-height: 88px;
      }

      .footer-brand img {
        width: 92px;
      }
    }

    @media (max-width: 440px) {
      .container {
        width: min(100% - 32px, 1120px);
      }

      .project {
        padding-left: 24px;
        padding-right: 24px;
      }

      .project-version {
        right: 24px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="container header-inner">

      <a class="brand" href="/" aria-label="Densa Labs home">
        <img
          src="Densa-Logo-White.png"
          alt="Densa"
        >
      </a>

      <label class="project-search">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-3.5-3.5"></path>
        </svg>

        <input
          id="project-search"
          type="search"
          placeholder="Search projects"
          autocomplete="off"
          aria-label="Search projects"
        >
      </label>

    </div>
  </header>

  <main>

    <section class="projects container">

      <div class="projects-header">
        <h1>Projects</h1>
      </div>

      <div class="project-grid" id="project-grid">

        <a
          class="project"
          href="/densa-ade/"
          data-project="densa ade agentic development environment autonomous coding agents developer tools"
          aria-label="View Densa ADE"
        >

          <img
            class="project-logo"
            src="Densa-ADE-Logo.png"
            alt="Densa ADE"
          >

          <div class="project-content">

            <h2>Agentic Development Environment</h2>

            <p>
              A development environment for structured, long-running software
              work powered by autonomous coding agents.
            </p>

            <span class="project-link">
              View project
              <span class="arrow" aria-hidden="true">→</span>
            </span>

          </div>

          <span class="project-version">
            v0.1.0
          </span>

        </a>

      </div>

      <div class="no-results" id="no-results">
        No projects found.
      </div>

    </section>

  </main>

  <footer>
    <div class="container footer-inner">

      <div class="footer-brand">
        <img
          src="Densa-Labs-Logo.png"
          alt="Densa Labs"
        >
      </div>

      <a
        class="footer-link"
        href="https://github.com/densa-labs"
        target="_blank"
        rel="noopener noreferrer"
      >
        GitHub
      </a>

    </div>
  </footer>

  <script>
    const searchInput = document.getElementById("project-search");
    const projects = document.querySelectorAll(".project");
    const noResults = document.getElementById("no-results");

    searchInput.addEventListener("input", () => {
      const query = searchInput.value
        .trim()
        .toLowerCase();

      let visibleProjects = 0;

      projects.forEach((project) => {
        const searchText = project.dataset.project.toLowerCase();
        const matches = searchText.includes(query);

        project.hidden = !matches;

        if (matches) {
          visibleProjects++;
        }
      });

      noResults.classList.toggle(
        "visible",
        visibleProjects === 0
      );
    });
  </script>

</body>
</html>
